[project]
name = "max-app-backend"
version = "0.1.0"
description = "FastAPI + бот MAX + PostgreSQL: бэкенд мини-приложения"
requires-python = ">=3.12"
dependencies = [
    # HTTP API для мини-аппа
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",   # [standard] = uvloop + httptools + watchfiles (нужен для --reload)
    # Бот MAX. Aiogram-подобная библиотека; [fastapi] добавляет интеграцию вебхука.
    # Версия, проверенная командой MAX, ставится из GitHub:
    #   maxapi @ git+https://github.com/max-messenger/max-botapi-python.git
    "maxapi[fastapi]>=1.2.2,<1.3",
    # База
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    # Конфиг из переменных окружения
    "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx2>=2.13",   # нужен для fastapi.testclient (Starlette перешла с httpx на httpx2)
    "ruff>=0.8",
]

[tool.uv]
# Бэкенд — приложение, а не библиотека: сам проект в venv не устанавливаем
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Автосгенерированные миграции не линтим
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
