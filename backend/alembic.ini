# Настройки Alembic. URL базы здесь не указан — он берётся из app.config
# (переменные POSTGRES_* из .env), см. migrations/env.py

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Имена файлов миграций: 2026_09_24_1530-<rev>_<описание>.py — сортируются по дате
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
